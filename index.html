<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>English Games</title>
  <script src="shared/settings.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      background: linear-gradient(180deg, #fff4d6, #ffe0ec);
      color: #3b3a5c;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-align: center;
      text-transform: uppercase;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    html[data-letter-case="lower"] body { text-transform: lowercase; }
    h1 { margin: 0 0 32px; font-size: clamp(36px, 7vmin, 64px); }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 24px 16px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.1);
      color: inherit;
      text-decoration: none;
      transition: transform 0.08s;
    }
    .game:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.1); }
    .icon { font-size: 80px; line-height: 1; }
    .name { font-size: 30px; font-weight: bold; }
    .what { font-size: 20px; opacity: 0.7; }

    /* ---------- Settings: ⚙️ button and panel ---------- */
    h1 { padding: 0 80px; } /* keep the title clear of the ⚙️ button */
    .settings-btn {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
      font-size: 32px;
      cursor: pointer;
      transition: transform 0.08s;
    }
    .settings-btn:active { transform: translateY(3px) scale(0.95); }
    .settings {
      position: relative;
      width: min(760px, calc(100vw - 32px));
      max-height: calc(100dvh - 48px);
      padding: 24px 20px 28px;
      border: 0;
      border-radius: 28px;
      background: #fffaf0;
      color: inherit;
      text-transform: inherit;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .settings::backdrop { background: rgba(20, 14, 50, 0.6); }
    .settings h2 { margin: 4px 64px 20px; font-size: 30px; }
    .settings-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: #ece6f5;
      color: inherit;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }
    .settings-close:active { transform: scale(0.94); }
    .setting {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 24px;
    }
    .choice {
      display: flex;
      gap: 8px;
      padding: 6px;
      border-radius: 22px;
      background: rgba(59, 58, 92, 0.1);
    }
    .choice button {
      min-width: 110px;
      height: 64px;
      border: 4px solid transparent;
      border-radius: 18px;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 32px;
      font-weight: bold;
      text-transform: none; /* show "ABC" and "abc" exactly as written */
      cursor: pointer;
      transition: transform 0.08s;
    }
    .choice button:active { transform: scale(0.95); }
    .choice button[aria-pressed="true"] {
      background: #fff;
      border-color: #ff8a3d;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
    }
    .choice button.follow-case { text-transform: inherit; font-size: 26px; }
    .setting + .setting { margin-top: 24px; }
    .setting-label { min-width: 90px; }

    /* Voice list: pick a voice, ▶ to hear a sample */
    .setting-voice { flex-direction: column; }
    .voices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(100%, 640px);
    }
    .voice-row { display: flex; gap: 10px; }
    .voice-pick {
      flex: 1;
      min-width: 0;
      min-height: 64px;
      padding: 8px 18px;
      border: 4px solid transparent;
      border-radius: 18px;
      background: #f1ecf7;
      color: inherit;
      font-family: inherit;
      font-size: 24px;
      text-align: left;
      text-transform: inherit;
      overflow-wrap: anywhere;
      cursor: pointer;
      transition: transform 0.08s;
    }
    .voice-pick:active { transform: scale(0.98); }
    .voice-pick[aria-pressed="true"] {
      background: #fff;
      border-color: #ff8a3d;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
    }
    .voice-name { text-transform: none; } /* exactly as the device reports it */
    .voice-pick small { display: block; font-size: 17px; opacity: 0.7; }
    .voice-play {
      width: 64px;
      height: 64px;
      flex: none;
      align-self: center;
      border: 0;
      border-radius: 50%;
      background: #2fbf68;
      box-shadow: 0 5px 0 #1f9450;
      color: #fff;
      font-size: 28px;
      padding-left: 5px; /* optically centre the ▶ */
      cursor: pointer;
      transition: transform 0.08s;
    }
    .voice-play:active { transform: translateY(4px); box-shadow: 0 1px 0 #1f9450; }
    .note { margin: 4px 0 0; font-size: 18px; opacity: 0.8; }
  </style>
</head>
<body>
  <button id="open-settings" class="settings-btn" type="button" aria-label="Settings" aria-haspopup="dialog">⚙️</button>
  <h1>English Games</h1>
  <nav class="games">
    <a class="game" href="number-words/index.html">
      <span class="icon" aria-hidden="true">🔢</span>
      <span class="name">Number Words</span>
      <span class="what">1 2 3 → one two three</span>
    </a>
    <a class="game" href="count-and-match/index.html">
      <span class="icon" aria-hidden="true">🍎</span>
      <span class="name">Count and Match</span>
      <span class="what">three ↔ 🍎🍎🍎</span>
    </a>
    <a class="game" href="halloween-words/index.html">
      <span class="icon" aria-hidden="true">🎃</span>
      <span class="name">Halloween</span>
      <span class="what">ghost, bat, witch…</span>
    </a>
    <a class="game" href="halloween-memory/index.html">
      <span class="icon" aria-hidden="true">🦇</span>
      <span class="name">Halloween Memory</span>
      <span class="what">find the hidden cards</span>
    </a>
  </nav>

  <!-- Settings for all games (saved in this browser) -->
  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <button id="close-settings" class="settings-close" type="button" aria-label="Close">✕</button>
    <h2 id="settings-title">⚙️ Settings</h2>
    <div class="setting">
      <span id="case-label" class="setting-label">Letters</span>
      <div class="choice" role="group" aria-labelledby="case-label">
        <button type="button" data-case="upper" aria-label="Uppercase letters">ABC</button>
        <button type="button" data-case="lower" aria-label="Lowercase letters">abc</button>
      </div>
    </div>
    <div class="setting">
      <span id="speed-label" class="setting-label">Speed</span>
      <div class="choice" role="group" aria-labelledby="speed-label">
        <button type="button" class="follow-case" data-speed="slow">🐢 slow</button>
        <button type="button" class="follow-case" data-speed="normal">normal</button>
        <button type="button" class="follow-case" data-speed="fast">🐇 fast</button>
      </div>
    </div>
    <div class="setting setting-voice">
      <span id="voice-label" class="setting-label">Voice</span>
      <div id="voices" class="voices" role="group" aria-labelledby="voice-label"></div>
      <p id="voice-note" class="note" hidden>The voice chosen before isn't on this device, so Default is used.</p>
    </div>
  </dialog>

  <script src="shared/kit.js"></script>
  <script>
    (function () {
      "use strict";
      const SAMPLE = "one, two, three, ghost";
      const caseButtons = document.querySelectorAll(".choice button[data-case]");
      const speedButtons = document.querySelectorAll(".choice button[data-speed]");
      const voiceList = document.getElementById("voices");
      const voiceNote = document.getElementById("voice-note");

      // ---------- Letters ----------
      function renderCase() {
        const current = Settings.getLetterCase();
        caseButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.case === current)));
      }
      caseButtons.forEach((b) => b.addEventListener("click", () => {
        Settings.setLetterCase(b.dataset.case);
        renderCase();
      }));

      // ---------- Speed ----------
      function renderSpeed() {
        const current = Settings.getSpeed();
        speedButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.speed === current)));
      }
      speedButtons.forEach((b) => b.addEventListener("click", () => {
        Settings.setSpeed(b.dataset.speed);
        renderSpeed();
      }));

      // ---------- Voice ----------
      // One row per British English voice name on this device, plus "Default" at the top.
      // `name` is what gets saved ("" = Default); the games use the best version of it.
      function voiceRow(name, label, detail) {
        const row = document.createElement("div");
        row.className = "voice-row";

        const pickBtn = document.createElement("button");
        pickBtn.type = "button";
        pickBtn.className = "voice-pick";
        pickBtn.dataset.voice = name;
        pickBtn.append(label);
        if (detail) {
          const small = document.createElement("small");
          small.append(detail);
          pickBtn.appendChild(small);
        }
        pickBtn.addEventListener("click", () => {
          Settings.setVoice(name);
          renderVoices();
        });

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "voice-play";
        playBtn.textContent = "▶";
        playBtn.setAttribute("aria-label", "Hear " + (name || "Default"));
        playBtn.addEventListener("click", () => {
          Kit.speakWith({ voice: name, speed: Settings.getSpeed() }, SAMPLE);
        });

        row.append(pickBtn, playBtn);
        return row;
      }

      function nameSpan(text) {
        const span = document.createElement("span");
        span.className = "voice-name";
        span.textContent = text;
        return span;
      }

      function renderVoices() {
        const voices = Settings.britishVoices();
        const saved = Settings.getVoice();
        const savedVoice = Settings.voiceFor(saved); // also finds a voice saved by an older version
        const savedHere = !saved || !!savedVoice;
        const selected = savedVoice ? savedVoice.name : "";

        voiceList.innerHTML = "";
        // Default: a known good British voice if there is one, otherwise the device's own
        const def = Kit.defaultVoice();
        const defLabel = document.createElement("span");
        defLabel.textContent = "Default";
        voiceList.appendChild(voiceRow("", defLabel, def ? nameSpan(def.name) : "This device's own voice"));
        // One row per name (Settings.britishVoices() keeps the best version of each)
        voices.forEach((v) => voiceList.appendChild(voiceRow(v.name, nameSpan(v.name), null)));

        voiceList.querySelectorAll(".voice-pick").forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset.voice === selected));
        });
        // Only mention the missing voice once the device has listed its voices
        voiceNote.hidden = savedHere || voices.length === 0;
      }

      if ("speechSynthesis" in window) {
        // Some browsers fill in the list a moment after the page opens
        speechSynthesis.addEventListener("voiceschanged", renderVoices);
      }

      function renderAll() {
        renderCase();
        renderSpeed();
        renderVoices();
      }
      window.addEventListener("pageshow", renderAll);
      renderAll();

      // ---------- Opening and closing the panel ----------
      const panel = document.getElementById("settings");
      document.getElementById("open-settings").addEventListener("click", () => {
        renderAll();
        if (panel.showModal) panel.showModal();
        else panel.setAttribute("open", "");
      });
      function closePanel() {
        if (panel.close) panel.close();
        else panel.removeAttribute("open");
      }
      document.getElementById("close-settings").addEventListener("click", closePanel);
      // Tapping the dark area around the panel also closes it. (The panel has its own
      // padding, so check the tap position rather than just the clicked element.)
      panel.addEventListener("click", (e) => {
        if (e.target !== panel) return;
        const r = panel.getBoundingClientRect();
        const outside = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
        if (outside) closePanel();
      });
    })();
  </script>
</body>
</html>
