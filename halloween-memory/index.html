<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Halloween Memory</title>
  <script src="../shared/settings.js"></script>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/halloween/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="start">
  <!-- Night sky background: moon, stars and hills -->
  <div class="sky" aria-hidden="true">
    <div class="moon"></div>
    <div class="hills"></div>
  </div>

  <header class="topbar">
    <a class="icon-btn" href="../index.html" aria-label="All games">🏠</a>
    <div id="progress" class="progress" aria-hidden="true"></div>
    <button id="mute" class="icon-btn" type="button" aria-label="Mute" aria-pressed="false">🔊</button>
  </header>

  <!-- Information panel (shown by the ℹ️ button; see setupInfo in ../shared/kit.js) -->
  <template id="game-info">
    <h2>Halloween Memory</h2>
    <p>Listen, remember and find the hidden Halloween cards.</p>
    <h3>How to play</h3>
    <ol>
      <li>Look at the cards and tap them to hear their names.</li>
      <li>Press ▶. The cards turn over and some of them swap places.</li>
      <li>The voice says a word: tap the card you think it is.</li>
      <li>The right card disappears. A wrong card shows itself, says its name and turns back over.</li>
      <li>Every turn asks for a different card. There are no hints: use your memory!</li>
      <li>The round ends when all the cards are found.</li>
    </ol>
    <h3>Who invented it</h3>
    <p>This game was invented by Flora, 6 years old, from Italy. 🇮🇹</p>
  </template>

  <main>
    <!-- The board is used both before playing (cards face up) and while playing (cards face down) -->
    <section id="screen-board" class="screen active">
      <div class="head">
        <h1 class="title start-only">Halloween Memory</h1>
        <div class="prompt game-only">
          <button id="listen" class="listen" type="button" aria-label="Listen again">🔊</button>
          <div id="bubble" class="bubble" aria-live="polite"></div>
        </div>
      </div>
      <div id="cards" class="mems"></div>
      <button id="play" class="big-btn pulse start-only" type="button" aria-label="Play">▶</button>
    </section>

    <!-- End screen -->
    <section id="screen-end" class="screen">
      <div id="end-pumpkin" class="trophy end-pumpkin" aria-hidden="true"></div>
      <h2 class="well-done">Happy Halloween!</h2>
      <div id="end-stars" class="end-stars" aria-hidden="true"></div>
      <div class="end-buttons">
        <button id="again" class="big-btn" type="button" aria-label="Play again">▶</button>
      </div>
    </section>
  </main>

  <div id="celebrate" class="celebrate" aria-hidden="true"></div>

  <script src="../shared/kit.js"></script>
  <script src="../shared/halloween/characters.js"></script>
  <script src="game.js"></script>
</body>
</html>
